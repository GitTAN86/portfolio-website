name: Deploy Next.js to Namecheap

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Prepare Deploy Package
        run: |
          mkdir -p deploy
          # Copy standalone server files
          cp -r .next/standalone/* deploy/
          # Copy static files and public assets into the standalone structure
          mkdir -p deploy/.next/static
          cp -r .next/static/* deploy/.next/static/ 2>/dev/null || true
          cp -r public deploy/ 2>/dev/null || true

      - name: Upload Package via Parallel LFTP
        run: |
          # LFTP with --parallel uploads multiple files at once, bypassing standard FTP limits
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" -e "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 3;
            set net:connection-limit 5;
            mirror -R -v --parallel=5 --ignore-time --ignore-size deploy/ /bahmannoushabadi.me/Auto_Agent/my_portfolio_project/;
            quit
          "

      - name: Create Restart Marker
        run: |
          mkdir -p tmp
          echo "Restarted at $(date)" > tmp/restart.txt

      - name: Restart Namecheap App
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: tmp/
          server-dir: bahmannoushabadi.me/Auto_Agent/my_portfolio_project/tmp/
