name: Deploy Next.js to Namecheap

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Prepare Deploy Package
        run: |
          mkdir -p deploy
          # Copy standalone server files
          cp -r .next/standalone/* deploy/
          # Copy static files and public assets into the standalone structure
          mkdir -p deploy/.next/static
          cp -r .next/static/* deploy/.next/static/ 2>/dev/null || true
          cp -r public deploy/ 2>/dev/null || true
          
          # Create a single ZIP file for fast upload
          cd deploy && zip -r ../deploy.zip .
          cd ..
          
          # Prepare a separate folder for the FTP sync (only the zip and unzipper)
          mkdir -p upload
          mv deploy.zip upload/
          cp extract.php upload/

      - name: Upload Package to Namecheap
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          passive: true
          local-dir: upload/
          server-dir: /my_portfolio_project/

      - name: Trigger Remote Extraction
        run: |
          # We call the PHP script to unzip the file on the server
          # Replace 'yourdomain.com' with your actual domain in your GitHub Secrets if needed
          # For now, we'll assume the FTP server-dir matches the web root
          curl -s -X GET "https://${{ secrets.DOMAIN_NAME }}/extract.php" || echo "Extraction triggered"

      - name: Create Restart Marker
        run: |
          mkdir -p tmp
          : > tmp/restart.txt

      - name: Restart Namecheap App
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          passive: true
          local-dir: tmp/
          server-dir: /my_portfolio_project/tmp/
