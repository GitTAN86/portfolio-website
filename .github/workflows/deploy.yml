name: Deploy Next.js to Namecheap

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Prepare Deploy Directory
        run: |
          mkdir -p deploy
          # Copy standalone server files
          cp -r .next/standalone/* deploy/
          # Copy static files and public assets into the standalone structure
          mkdir -p deploy/.next/static
          cp -r .next/static/* deploy/.next/static/ 2>/dev/null || true
          cp -r public deploy/ 2>/dev/null || true

      - name: Sync Files to Namecheap
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          passive: true
          timeout: 300000
          local-dir: deploy/
          server-dir: /my_portfolio_project/
          exclude: |
            **/.git/**
            **/.github/**
            **/.next/cache/**
            src/**

      - name: Create Restart Marker
        run: |
          mkdir -p tmp
          # Namecheap/cPanel Node.js Selector watches tmp/restart.txt or tmp/restart.js
          : > tmp/restart.txt

      - name: Restart Namecheap App
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          passive: true
          local-dir: tmp/
          server-dir: /my_portfolio_project/tmp/
          timeout: 300000
