<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahman Portfolio - Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #05050A; color: white; display: flex; flex-direction: column; min-height: 100vh; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 40px; }
        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="theme-4">
    <!-- Login Screen -->
    <div id="loginScreen" class="modal active" style="position: relative; display: flex; height: 100vh; background: transparent;">
        <div class="modal-content glass-card">
            <h2 style="margin-bottom: 20px;">Admin Secure Login</h2>
            <form id="adminLoginForm">
                <input type="email" id="adminEmail" placeholder="Firebase Admin Email" required style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white;">
                <input type="password" id="adminPassword" placeholder="Password" required style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white;">
                <button type="submit" class="submit-btn" style="width: 100%;">Access Analytics</button>
            </form>
            <p id="loginError" style="color: #EA4335; display: none; margin-top: 15px;"></p>
        </div>
    </div>

    <!-- Dashboard Screen (Hidden until authenticated) -->
    <div id="dashboardScreen" style="display: none; padding: 40px; width: 100%; max-width: 1200px; margin: 0 auto; flex-grow: 1;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 class="section-title" style="margin: 0;">Admin Portal</h1>
            <button id="logoutBtn" class="submit-btn" style="width: auto;">Logout</button>
        </div>
        
        <!-- Tabs -->
        <div style="display: flex; gap: 20px; margin-bottom: 30px;">
            <button id="tabAnalytics" class="submit-btn" style="background: var(--color-primary); width: auto;">Analytics Dashboard</button>
            <button id="tabContent" class="submit-btn" style="background: rgba(255,255,255,0.1); width: auto;">Content Manager</button>
        </div>
        
        <div id="analyticsView" class="dashboard-grid">
            <!-- Traffic Chart -->
            <div class="glass-card">
                <h3 style="margin-bottom: 20px;">Visitor Traffic (Last 100 Visits)</h3>
                <canvas id="visitsChart"></canvas>
            </div>
            
            <!-- Feedback List -->
            <div class="glass-card" style="max-height: 500px; overflow-y: auto;">
                <h3 style="margin-bottom: 20px;">Direct Feedback</h3>
                <div id="feedbackList">
                    <p style="color: #a0a0a0;">Loading feedback...</p>
                </div>
            </div>
        </div>

        <div id="contentView" style="display: none;">
            <div class="glass-card">
                <h3 style="margin-bottom: 20px;">Website Content Editor</h3>
                <form id="cmsForm" style="display: flex; flex-direction: column; gap: 15px;">
                    <label>Hero Name</label>
                    <input type="text" id="cmsName" style="padding: 10px; background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;">
                    
                    <label>Hero Tagline</label>
                    <input type="text" id="cmsTagline" style="padding: 10px; background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;">
                    
                    <label>Hero Headline</label>
                    <input type="text" id="cmsHeadline" style="padding: 10px; background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;">
                    
                    <label>About Text (HTML allowed)</label>
                    <textarea id="cmsAbout" rows="6" style="padding: 10px; background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;"></textarea>
                    
                    <!-- Contact Links Editor -->
                    <div style="border: 1px solid rgba(255,255,255,0.2); padding: 15px; border-radius: 5px; background: rgba(0,0,0,0.1);">
                        <label style="margin:0 0 10px 0; display:block; font-weight: bold; color: #34A853;">Contact Links</label>
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <input type="text" id="cmsLinkedin" placeholder="LinkedIn URL" style="padding: 10px; background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;">
                            <input type="text" id="cmsEmail" placeholder="Email Address" style="padding: 10px; background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;">
                            <input type="text" id="cmsWhatsapp" placeholder="WhatsApp Number (e.g. 60194909004)" style="padding: 10px; background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;">
                        </div>
                    </div>
                    
                    <!-- Dynamic Skills Editor -->
                    <div style="border: 1px solid rgba(255,255,255,0.2); padding: 15px; border-radius: 5px; background: rgba(0,0,0,0.1);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <label style="margin:0; font-weight: bold; color: #4285F4;">Skills</label>
                            <button type="button" id="addSkillBtn" class="submit-btn" style="width: auto; padding: 5px 10px; font-size: 0.8rem; border-radius: 4px;">+ Add Skill</button>
                        </div>
                        <div id="skillsContainer" style="display: flex; flex-direction: column; gap: 15px;"></div>
                    </div>
                    
                    <!-- Dynamic Experience Editor -->
                    <div style="border: 1px solid rgba(255,255,255,0.2); padding: 15px; border-radius: 5px; background: rgba(0,0,0,0.1);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <label style="margin:0; font-weight: bold; color: #b100ff;">Professional Experience</label>
                            <button type="button" id="addExpBtn" class="submit-btn" style="width: auto; padding: 5px 10px; font-size: 0.8rem; border-radius: 4px;">+ Add Experience</button>
                        </div>
                        <div id="expContainer" style="display: flex; flex-direction: column; gap: 15px;"></div>
                    </div>
                    
                    <button type="submit" class="submit-btn" style="margin-top: 20px; max-width: 250px;">Publish Changes Live</button>
                    <p id="cmsStatus" style="margin-top: 10px;"></p>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
